<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公園さがし プロトタイプ(モノクロ版)</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --ink: #111111;
    --sub: #777777;
    --line: #dddddd;
    --accent: #111111;
    --hi: #ececec;
    --hi-line: #111111;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: #e6e6e6;
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: left; }

  /* 実機(狭い画面)ではそのまま全画面。端末のセーフエリアは env() で取る */
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --s: 1;
  }
  .app {
    position: relative;
    width: 100%;
    height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* PCなど広い画面では iPhone 17 の画面(402×874pt)を再現して表示。
     収まらない場合は --s(JSで計算)で縮小する */
  @media (min-width: 500px) {
    :root { --safe-top: 62px; --safe-bottom: 34px; }
    .app {
      position: fixed; left: 50%; top: 50%;
      width: 402px; height: 874px;
      transform: translate(-50%, -50%) scale(var(--s));
      border-radius: 56px;
      box-shadow: 0 0 0 10px #111, 0 12px 40px rgba(0,0,0,.28);
    }
    /* ダイナミックアイランドとホームインジケーターの目安 */
    .app::before {
      content: ''; position: absolute; z-index: 50;
      top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px;
      border-radius: 20px; background: #000; pointer-events: none;
    }
    .app::after {
      content: ''; position: absolute; z-index: 50;
      bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px;
      border-radius: 3px; background: rgba(0,0,0,.85); pointer-events: none;
    }
  }

  /* header */
  .top {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(var(--safe-top) + 8px) 16px 10px;
    min-height: calc(var(--safe-top) + 52px);
  }
  .back {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line);
    font-size: 18px; line-height: 1;
  }
  .top h1 { font-size: 18px; font-weight: 700; flex: 1; }
  .top .note { font-size: 11px; color: var(--sub); }

  main { flex: 1; overflow-y: auto; padding: 0 0 16px; min-height: 0; }
  main.fill { padding: 0; overflow: hidden; display: flex; flex-direction: column; }

  /* tab bar */
  .tabs {
    flex: none;
    display: flex;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding-bottom: var(--safe-bottom);
  }
  .tab {
    flex: 1; text-align: center; padding: 12px 0 14px;
    font-size: 13px; color: var(--sub); font-weight: 600;
  }
  .tab.on { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }

  .banner {
    flex: none;
    margin: 0 16px 8px;
    padding: 10px 12px;
    background: var(--hi);
    border: 1px solid var(--hi-line);
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    display: flex; align-items: center; gap: 10px;
  }
  .banner .txt { flex: 1; min-width: 0; }
  .banner b { font-size: 15px; }
  .bchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .bchip {
    padding: 5px 10px; border-radius: 999px;
    background: #fff; border: 1px solid var(--hi-line);
    font-size: 12px; font-weight: 700; color: #111;
  }
  .banner .clear {
    flex: none;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.7); border: 1px solid var(--hi-line);
    font-size: 12px; font-weight: 700;
  }

  /* ---- 公園コレクション: 2次元グリッド ----
     縦 = 近さ(上が近い) / 横 = 遊びの対象年齢(左が幼児向け、右が大きい子向け)
     中央に寄ったセルが拡大して前面に出る */
  .field {
    flex: 1;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .field::-webkit-scrollbar { display: none; }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cw));
    grid-auto-rows: var(--ch);
    gap: var(--gap);
    padding: var(--pady) var(--padx);
    width: max-content;
  }
  .cell {
    --t: 0;
    position: relative;
    display: block;
    width: var(--cw);
    height: var(--ch);
    border-radius: 14px;
    overflow: hidden;
    will-change: transform;
    cursor: pointer;
    text-align: left;
    box-shadow:
      0 0 0 calc(3px * var(--t)) rgba(17,17,17,var(--t)),
      0 calc(10px * var(--t)) calc(26px * var(--t)) rgba(0,0,0,calc(.25 * var(--t)));
  }
  .photo {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: rgba(0,0,0,.42);
    font-size: 14px; font-weight: 600;
  }
  .photo small { font-size: 11px; font-weight: 500; }
  .cell .photo span, .cell .photo small { opacity: calc(1 - var(--t)); } /* 写真の代用テキスト。中央では消して情報表示と重ならないようにする */
  .veil { position: absolute; inset: 0; background: #f5f5f5; opacity: calc((1 - var(--t)) * .32); pointer-events: none; }
  .info {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 9px 9px;
    color: #fff;
    background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.66));
    opacity: clamp(0, calc((var(--t) - .55) * 2.2), 1);
    pointer-events: none;
  }
  .info .n { font-size: 13px; font-weight: 700; line-height: 1.3; }
  .info .m { font-size: 10.5px; opacity: .92; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
  .chip {
    font-size: 10px; font-weight: 600; line-height: 1;
    padding: 5px 8px; border-radius: 999px;
    background: rgba(255,255,255,.24);
    pointer-events: none;           /* 中央のセルだけ押せる(.cell.sel) */
  }
  .cell.sel .chip[data-chip] { pointer-events: auto; cursor: pointer; }
  .chip.hi { background: #fff; color: #111; }

  /* generic list */
  .list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .row {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px;
  }
  .row .body { flex: 1; min-width: 0; }
  .row .t { font-size: 15px; font-weight: 700; }
  .row .s { font-size: 12px; color: var(--sub); margin-top: 2px; line-height: 1.5; }
  .chev { color: var(--sub); }
  .ico {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 700; color: #fff;
    flex: none;
  }

  /* single */
  .single { padding: 4px 16px; display: flex; flex-direction: column; gap: 14px; }
  .photo-hero {
    height: 170px; border-radius: 18px;
    display: grid; place-items: center;
    color: rgba(0,0,0,.42); font-size: 15px; font-weight: 600;
  }
  .hero {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px;
  }
  .hero h2 { font-size: 22px; margin-bottom: 8px; }
  .meta { font-size: 14px; color: var(--sub); line-height: 1.7; }
  .meta b { color: var(--ink); }
  .desc { font-size: 15px; line-height: 1.8; }
  .cta {
    width: 100%;
    background: var(--accent); color: #fff;
    border-radius: 14px; padding: 14px 16px;
    font-size: 15px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .empty { padding: 32px 16px; color: var(--sub); text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="parks">公園</button>
    <button class="tab" data-tab="types">遊具</button>
  </nav>
</div>

<script>
/* ---------- ダミーデータ(モデルレイヤー) ---------- */

// 遊具(一般名詞): 名称、特徴、対象年齢の目安(from〜to歳)
const EQUIPMENT_TYPES = [
  { id: 't1', name: 'すべり台',       age: [2, 8],  feature: '高いところから滑り降りる定番の遊具。幼児向けの低いものから、長いローラー式まで種類がある。' },
  { id: 't2', name: 'ブランコ',       age: [3, 10], feature: '座って揺れる遊具。乳幼児用のバケット型は安全ベルト付き。順番待ちが起きやすい。' },
  { id: 't3', name: '砂場',           age: [1, 5],  feature: '砂遊びができる場所。スコップやバケツを持参すると遊びの幅が広がる。' },
  { id: 't4', name: 'シーソー',       age: [4, 10], feature: '2人で向かい合って上下に揺れる遊具。バランスを取る遊びで、小学生にも人気。' },
  { id: 't5', name: 'ジャングルジム', age: [5, 12], feature: '登って遊ぶ格子状の遊具。高さがあるので、小さい子には付き添いが必要。' },
  { id: 't6', name: '鉄棒',           age: [5, 12], feature: 'ぶら下がりや逆上がりの練習に使う。高さが複数あることが多い。' },
  { id: 't7', name: 'スプリング遊具', age: [1, 4],  feature: '動物などの形をした、バネで揺れる乗り物。1〜4歳くらいの幼児向け。' },
  { id: 't8', name: 'ターザンロープ', age: [6, 12], feature: 'ロープにつかまって滑走する遊具。体力のある小学生向け。' },
  { id: 't9', name: '複合遊具',       age: [3, 10], feature: 'すべり台・階段・トンネルなどが一体になった大型遊具。1つで長く遊べる。' }
];

// 公園: 名称、住所 / 設置遊具: 遊具種別、公園内での設置場所
// 現在地からの距離(m)はダミー。本来は現在地から算出される値。
const P = (id, name, address, distance, eq) =>
  ({ id, name, address: '横浜市港北区' + address, distance, equipment: eq.map(([type, place]) => ({ type, place })) });

const PARKS = [
  P('p1',  'ひなた児童公園',   '日吉本町1-2-3',  180,  [['t3','入口のすぐ右手'],['t7','砂場の隣'],['t1','奥の築山']]),
  P('p2',  'たんぽぽ公園',     '日吉本町3-7-1',  260,  [['t3','入口の正面'],['t7','ベンチの前']]),
  P('p3',  'どんぐり広場',     '日吉本町2-8-14', 320,  [['t2','北側の木陰'],['t1','広場の中央'],['t6','東のフェンス沿い'],['t3','ベンチの横']]),
  P('p4',  'こもれび公園',     '日吉4-5-6',      450,  [['t9','広場の中央'],['t5','複合遊具の西側'],['t4','南の出入口そば'],['t2','木立の奥'],['t3','東屋の前']]),
  P('p5',  'ことり公園',       '日吉5-2-9',      520,  [['t1','入口のすぐ左手'],['t7','すべり台の隣'],['t3','奥の木陰'],['t2','西のフェンス沿い']]),
  P('p6',  'つばめ公園',       '綱島西1-9-2',    700,  [['t1','駐車場側の入口'],['t2','池のそば']]),
  P('p7',  'さくら坂公園',     '綱島西3-4-5',    780,  [['t6','坂の上'],['t5','広場の北'],['t8','坂の途中']]),
  P('p8',  'もみじ児童公園',   '綱島東1-6-7',    880,  [['t9','中央広場'],['t1','複合遊具に併設'],['t3','出入口のそば']]),
  P('p9',  'せせらぎ公園',     '綱島東3-1-10',   980,  [['t8','小川沿いの斜面'],['t5','芝生広場の北'],['t1','芝生広場の南'],['t6','管理棟の裏'],['t3','水飲み場の隣'],['t7','入口のすぐ左手']]),
  P('p10', 'ひだまり広場',     '大倉山2-3-4',    1150, [['t3','日だまりの一角'],['t2','南側のベンチ前'],['t7','砂場の隣'],['t1','北の築山']]),
  P('p11', 'あおぞら中央公園', '新横浜2-4-8',    1400, [['t9','中央広場'],['t8','丘の上'],['t4','東ゲートそば'],['t2','噴水の西'],['t6','遊歩道沿い']]),
  P('p12', 'はなみずき公園',   '新横浜3-9-1',    1500, [['t1','入口の正面'],['t4','木陰の下'],['t6','奥のフェンス沿い']]),
  P('p13', 'ふれあい公園',     '篠原町5-5-5',    1700, [['t9','中央広場'],['t1','複合遊具の隣'],['t3','東屋の前'],['t7','入口のそば'],['t2','北の木立']]),
  P('p14', 'ゆうやけ公園',     '小机町2-7-8',    1900, [['t5','夕日の見える丘'],['t6','丘の下'],['t4','南の出入口']]),
  P('p15', '若葉ヶ丘公園',     '菊名7-3-3',      2100, [['t1','丘のてっぺん'],['t5','展望デッキの下'],['t3','丘のふもと']]),
  P('p16', 'みなと台公園',     '鳥山町1-1-1',    2600, [['t8','丘の斜面'],['t9','中央広場'],['t5','広場の西'],['t6','広場の東'],['t4','北の出入口']])
];

/* ---------- ヘルパー ---------- */
const typeById = id => EQUIPMENT_TYPES.find(t => t.id === id);
const parkById = id => PARKS.find(p => p.id === id);
const fmtDist = m => m < 1000 ? m + 'm' : (m / 1000).toFixed(1) + 'km';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = id => parseInt(id.slice(1), 10);
const icon = t => `<span class="ico" style="background:#222">${esc(t.name.charAt(0))}</span>`;
const fmtAge = t => `${t.age[0]}〜${t.age[1]}歳`;

// 公園の対象年齢スコア(算出値): 設置遊具の対象年齢の中心値の平均
const ageScore = p => p.equipment.reduce((sum, e) => {
  const a = typeById(e.type).age; return sum + (a[0] + a[1]) / 2;
}, 0) / p.equipment.length;
const ageLabel = p => { const s = ageScore(p); return s < 4.5 ? '幼児向け' : s < 7 ? '幼児〜小学生' : '小学生向け'; };

// 写真プレースホルダー(モノクロ版は灰色。隣のセルと区別できるよう明度だけ変える)
const PHOTO_GRAYS = [78, 70, 82, 74, 66, 76];
const photoBg = id => `hsl(0 0% ${PHOTO_GRAYS[num(id) % PHOTO_GRAYS.length]}%)`;

/* グリッド配置: 距離順に4件ずつ行にする(縦=近さ)。各行の中は対象年齢スコア順(横=幼児向け→大きい子向け) */
const COLS = 4;
function buildGrid(parks) {
  const sorted = parks.slice().sort((a, b) => a.distance - b.distance);
  const cells = [];
  for (let r = 0; r * COLS < sorted.length; r++) {
    const row = sorted.slice(r * COLS, r * COLS + COLS).sort((a, b) => ageScore(a) - ageScore(b));
    row.forEach((p, c) => cells.push({ park: p, r, c }));
  }
  return cells;
}

/* ---------- ナビゲーション(インタラクションレイヤー) ----------
   公園コレクション → 公園シングル → 設置遊具コレクション → 遊具シングル
   遊具コレクション → 遊具シングル → 公園コレクション(絞り込み)
   設置遊具のシングルは存在しない。                                   */
let stack = [{ v: 'parks' }];
const current = () => stack[stack.length - 1];

function go(v, params) { stack.push(Object.assign({ v }, params)); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function switchTab(tab) { stack = [{ v: tab }]; render(); }

/* ---------- 画面 ---------- */
const views = {
  // 公園コレクション: 縦横に自由にスライドする写真グリッド。中央のセルが選択状態
  parks(s) {
    const focus = s.typeIds || [];   // 絞り込み中の遊具(複数可)。選んだ遊具がすべてある公園だけを出す
    let parks = PARKS.slice();
    if (focus.length) parks = parks.filter(p => focus.every(id => p.equipment.some(e => e.type === id)));
    const cells = buildGrid(parks);
    const cols = Math.min(COLS, parks.length);

    const banner = focus.length
      ? `<div class="banner"><div class="txt">
           <div><b>${parks.length}件</b>${focus.length > 1 ? ' ・ 選んだ遊具がすべてある公園' : ' の公園'}</div>
           <div class="bchips">${focus.map(id => `<button class="bchip" data-unchip="${id}">${esc(typeById(id).name)} ✕</button>`).join('')}</div>
         </div><button class="clear" data-clear>全解除</button></div>`
      : '';

    const cellsHtml = cells.map(({ park: p, r, c }) => {
      const eqs = p.equipment.slice();
      if (focus.length) eqs.sort((a, b) => focus.includes(b.type) - focus.includes(a.type)); // 選んだ遊具を先頭へ
      const MAX = 5;
      const chips = eqs.slice(0, MAX).map(e => {
        const hi = focus.includes(e.type) ? ' hi' : '';
        return `<span class="chip${hi}" data-chip="${e.type}">${esc(typeById(e.type).name)}</span>`;
      }).join('') + (eqs.length > MAX ? `<span class="chip">他${eqs.length - MAX}</span>` : '');
      return `<div class="cell" role="button" tabindex="0" data-cell data-id="${p.id}" style="grid-row:${r + 1};grid-column:${c + 1}">
        <div class="photo" style="background:${photoBg(p.id)}"><span>公園の写真</span><small>No.${String(num(p.id)).padStart(2, '0')}</small></div>
        <div class="veil"></div>
        <div class="info">
          <div class="n">${esc(p.name)}</div>
          <div class="m">${fmtDist(p.distance)} ・ ${ageLabel(p)}</div>
          <div class="chips">${chips}</div>
        </div>
      </div>`;
    }).join('');

    return {
      title: '近くの公園',
      note: '現在地:ダミー',
      fill: true,
      html: banner + `<div class="field" id="field"><div class="grid" id="grid" style="--cols:${cols}">${cellsHtml}</div></div>`,
      after: () => initField(s, cells)
    };
  },

  // 公園シングル
  park(s) {
    const p = parkById(s.id);
    return {
      title: '公園',
      html: `<div class="single">
        <div class="photo-hero" style="background:${photoBg(p.id)}">公園の写真</div>
        <div class="hero">
          <h2>${esc(p.name)}</h2>
          <div class="meta">
            <div><b>住所</b>　${esc(p.address)}</div>
            <div><b>現在地から</b>　${fmtDist(p.distance)}</div>
            <div><b>遊びの対象</b>　${ageLabel(p)}</div>
          </div>
        </div>
        <button class="cta" data-go="placed" data-id="${p.id}">
          <span>この公園の遊具を見る(${p.equipment.length})</span><span>›</span>
        </button>
      </div>`
    };
  },

  // 設置遊具コレクション(公園シングルからのみ到達。シングルは無し→遊具シングルへ)
  placed(s) {
    const p = parkById(s.id);
    const rows = p.equipment.map(e => {
      const t = typeById(e.type);
      return `<button class="row" data-go="type" data-id="${t.id}">
        ${icon(t)}
        <span class="body"><div class="t">${esc(t.name)}</div><div class="s">設置場所:${esc(e.place)}</div></span>
        <span class="chev">›</span>
      </button>`;
    }).join('');
    return { title: p.name + ' の遊具', html: `<div class="list">${rows}</div>` };
  },

  // 遊具コレクション
  types() {
    const rows = EQUIPMENT_TYPES.map(t => `
      <button class="row" data-go="type" data-id="${t.id}">
        ${icon(t)}
        <span class="body"><div class="t">${esc(t.name)}</div><div class="s">対象年齢の目安 ${fmtAge(t)}</div></span>
        <span class="chev">›</span>
      </button>`).join('');
    return { title: '遊具', html: `<div class="list">${rows}</div>` };
  },

  // 遊具シングル
  type(s) {
    const t = typeById(s.id);
    const n = PARKS.filter(p => p.equipment.some(e => e.type === t.id)).length;
    return {
      title: '遊具',
      html: `<div class="single">
        <div class="hero">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">${icon(t)}<h2 style="margin:0">${esc(t.name)}</h2></div>
          <p class="desc">${esc(t.feature)}</p>
          <div class="meta" style="margin-top:10px"><b>対象年齢の目安</b>　${fmtAge(t)}</div>
        </div>
        <button class="cta" data-go="parks" data-type="${t.id}">
          <span>${esc(t.name)}がある公園を見る(${n})</span><span>›</span>
        </button>
      </div>`
    };
  }
};

/* ---------- グリッドの動作 ----------
   スクロール位置から各セルの「中央までの距離」を求め、近いほど拡大・前面化する。
   セルが中央にある時 scrollLeft = c*px, scrollTop = r*py になるように余白を取っている。 */
const MAX_SCALE = 1.36;
let F = null;          // 現在表示中のグリッドの状態
let suppressClick = false;

function initField(s, cells) {
  if (F && F.timer) clearTimeout(F.timer);
  const el = document.getElementById('field');
  const grid = document.getElementById('grid');
  const W = el.clientWidth, H = el.clientHeight;
  const cw = Math.round(W * 0.36), ch = Math.round(cw * 1.3), gap = 6;
  grid.style.setProperty('--cw', cw + 'px');
  grid.style.setProperty('--ch', ch + 'px');
  grid.style.setProperty('--gap', gap + 'px');
  grid.style.setProperty('--padx', (W - cw) / 2 + 'px');
  grid.style.setProperty('--pady', (H - ch) / 2 + 'px');

  const nodes = [...grid.querySelectorAll('.cell')];
  F = { el, px: cw + gap, py: ch + gap, sel: null, timer: null, touching: false, dragging: false,
        cells: cells.map((c, i) => ({ id: c.park.id, r: c.r, c: c.c, el: nodes[i] })) };

  // 初期位置: 前回選択していた公園、なければ最寄りの公園
  const start = F.cells.find(c => c.id === s.sel) ||
    F.cells.find(c => c.id === cells.slice().sort((a, b) => a.park.distance - b.park.distance)[0].park.id);
  F.sel = start.id;
  el.scrollLeft = start.c * F.px;
  el.scrollTop = start.r * F.py;
  updateField();

  // スナップはブラウザ任せにしない(CSSのスナップ機能は、端が欠けたグリッドで空きマスに止まったり、
  // マウスのドラッグを離した瞬間に位置が飛んだりしたため)。スクロールが止まったら、実在する最寄りの公園へ滑らかに寄せる。
  let ticking = false;
  el.addEventListener('scroll', () => {
    scheduleSettle();
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateField(); });
  }, { passive: true });

  // タッチ: 指を離して慣性スクロールが止まったら寄せる(指を置いている間は寄せない)
  el.addEventListener('touchstart', () => { F.touching = true; clearTimeout(F.timer); }, { passive: true });
  const touchEnd = () => { F.touching = false; scheduleSettle(); };
  el.addEventListener('touchend', touchEnd, { passive: true });
  el.addEventListener('touchcancel', touchEnd, { passive: true });

  // マウス操作用のドラッグスクロール
  let drag = null;
  el.addEventListener('pointerdown', ev => {
    if (ev.pointerType !== 'mouse' || ev.button !== 0) return;
    // 画面を縮小表示しているときは、ポインタの移動量を縮小率で割ってスクロール量に直す
    const k = el.getBoundingClientRect().width / el.offsetWidth || 1;
    drag = { x: ev.clientX, y: ev.clientY, l: el.scrollLeft, t: el.scrollTop, k, moved: false, samples: [] };
    F.dragging = true;
    clearTimeout(F.timer);
    el.style.cursor = 'grabbing';
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });
  function onMove(ev) {
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
    el.scrollLeft = drag.l - dx / drag.k;
    el.scrollTop = drag.t - dy / drag.k;
    const now = performance.now();
    drag.samples.push([now, el.scrollLeft, el.scrollTop]);
    while (drag.samples.length > 2 && now - drag.samples[0][0] > 100) drag.samples.shift();
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    if (!drag) return;
    const d = drag;
    drag = null;
    F.dragging = false;
    el.style.cursor = '';
    if (!d.moved) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    // 離す直前の速度から行き先を決める(勢いをつけて離すと、その向きの先の公園へ進む)
    const a = d.samples[0], b = d.samples[d.samples.length - 1];
    const fling = performance.now() - b[0] < 80 ? 1 : 0;      // 止めてから離したなら勢いは無し
    const dt = Math.max(1, b[0] - a[0]);
    const maxL = el.scrollWidth - el.clientWidth, maxT = el.scrollHeight - el.clientHeight;
    const pl = Math.min(maxL, Math.max(0, el.scrollLeft + fling * (b[1] - a[1]) / dt * 180));
    const pt = Math.min(maxT, Math.max(0, el.scrollTop + fling * (b[2] - a[2]) / dt * 180));
    settle(nearestCell(pl / F.px, pt / F.py));
  }
}

// スクロールが止まって120ms経ったら、最寄りの公園へ寄せる
function scheduleSettle() {
  if (!F) return;
  clearTimeout(F.timer);
  if (F.touching || F.dragging) return;
  F.timer = setTimeout(() => settle(), 120);
}
function settle(cell) {
  if (!F || !F.el.isConnected) return;
  const c = cell || nearestCell();
  if (Math.abs(c.c * F.px - F.el.scrollLeft) < 0.5 && Math.abs(c.r * F.py - F.el.scrollTop) < 0.5) return;
  F.el.scrollTo({ left: c.c * F.px, top: c.r * F.py, behavior: 'smooth' });
}

function nearestCell(sl = F.el.scrollLeft / F.px, st = F.el.scrollTop / F.py) {
  let best = null, bd = Infinity;
  F.cells.forEach(cell => {
    const d = Math.hypot(sl - cell.c, st - cell.r);
    if (d < bd) { bd = d; best = cell; }
  });
  return best;
}

function updateField() {
  if (!F || !F.el.isConnected || current().v !== 'parks') return;
  const sl = F.el.scrollLeft / F.px, st = F.el.scrollTop / F.py;
  let best = null, bd = Infinity;
  F.cells.forEach(cell => {
    const d = Math.hypot(sl - cell.c, st - cell.r);
    const x = Math.min(1, Math.max(0, 1 - d));
    const t = x * x * (3 - 2 * x);            // smoothstep
    cell.el.style.setProperty('--t', t.toFixed(3));
    cell.el.style.transform = `scale(${(1 + (MAX_SCALE - 1) * t).toFixed(3)})`;
    cell.el.style.zIndex = Math.round(t * 100);
    if (d < bd) { bd = d; best = cell; }
  });
  if (best && best.id !== F.sel) F.sel = best.id;
  if (best) current().sel = best.id;
  F.cells.forEach(cell => cell.el.classList.toggle('sel', best === cell)); // 中央のセルだけタグを押せる
}

// タグ(設置遊具)を押す → 公園コレクションの中でその遊具がある公園に絞り込む。同じタグをもう一度押すと解除。
// 画面は遷移せず、いま中央にある公園はそのまま中央に残る(選択位置は current().sel に保存済み)
function toggleFilter(typeId) {
  const s = current();
  const ids = s.typeIds || [];
  s.typeIds = ids.includes(typeId) ? ids.filter(id => id !== typeId) : ids.concat(typeId);
  render();
}
function clearFilter() { current().typeIds = []; render(); }

function centerOn(id) {
  const cell = F.cells.find(c => c.id === id);
  if (cell) F.el.scrollTo({ left: cell.c * F.px, top: cell.r * F.py, behavior: 'smooth' });
}

// 中央のセルをタップ → 公園シングル。周辺のセルをタップ → そのセルを中央へ寄せて選択
function onCell(id) {
  if (id === F.sel) go('park', { id });
  else centerOn(id);
}

/* ---------- 描画 ---------- */
function render() {
  const s = current();
  const out = views[s.v](s);

  document.getElementById('top').innerHTML =
    (stack.length > 1 ? '<button class="back" data-back aria-label="戻る">‹</button>' : '') +
    `<h1>${esc(out.title)}</h1>` + (out.note ? `<span class="note">${esc(out.note)}</span>` : '');

  const main = document.getElementById('main');
  main.classList.toggle('fill', !!out.fill);
  main.innerHTML = out.html;
  main.scrollTop = 0;
  if (out.after) out.after();

  const root = stack[0].v;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === root));
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) return switchTab(tab.dataset.tab);
  if (e.target.closest('[data-back]')) return back();
  if (e.target.closest('[data-clear]')) return clearFilter();
  const unchip = e.target.closest('[data-unchip]');
  if (unchip) return toggleFilter(unchip.dataset.unchip);
  const chip = e.target.closest('[data-chip]');
  if (chip) { if (suppressClick) return; return toggleFilter(chip.dataset.chip); }
  const cell = e.target.closest('[data-cell]');
  if (cell) { if (suppressClick) return; return onCell(cell.dataset.id); }
  const g = e.target.closest('[data-go]');
  if (g) {
    const v = g.dataset.go;
    if (v === 'parks') return go('parks', { typeIds: [g.dataset.type] });
    return go(v, { id: g.dataset.id });
  }
});

// 広い画面では iPhone 17(402×874pt)がウィンドウに収まるように縮小率を決める
function fitFrame() {
  const framed = window.matchMedia('(min-width: 500px)').matches;
  const s = framed ? Math.min(1, (innerHeight - 24) / 874, (innerWidth - 24) / 402) : 1;
  document.documentElement.style.setProperty('--s', s.toFixed(4));
}
fitFrame();
// 画面サイズが実際に変わったときだけ描き直す(同じサイズのresizeで描き直すと、スクロール中に位置が飛ぶ)
let lastSize = [innerWidth, innerHeight];
window.addEventListener('resize', () => {
  fitFrame();
  if (innerWidth === lastSize[0] && innerHeight === lastSize[1]) return;
  lastSize = [innerWidth, innerHeight];
  if (current().v === 'parks') render();
});

render();
</script>
</body>
</html>
